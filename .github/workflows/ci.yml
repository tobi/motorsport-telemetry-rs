name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # validate-mtx.py runs under `uv run --with jsonschema` from a unit test.
      - uses: astral-sh/setup-uv@v6
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Include example tests (the audit probe has NaN/unit regressions),
      # then run doctests separately: --all-targets does not include them.
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Core depends on the atlas, which need not be published yet. Modern
      # Cargo stages selected workspace packages together for verification.
      # Use stable explicitly; rust-toolchain.toml pins the library's MSRV.
      - run: cargo +stable package -p motorsport-track-atlas -p motorsport-telemetry-core --allow-dirty
