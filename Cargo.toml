[workspace]
resolver = "2"
members = [
    "crates/motorsport-telemetry",
    "crates/motorsport-track-atlas",
    "crates/telemetry-core",
    "crates/aim-telemetry",
    "crates/cosworth-telemetry",
    "crates/motec-telemetry",
    "crates/racelogic-telemetry",
    "crates/telemetry-format",
    "crates/telemetry-passes",
]

[workspace.package]
version = "1.3.5"
edition = "2021"
rust-version = "1.84"
license = "MIT"
repository = "https://github.com/tobi/motorsport-telemetry-rs"
homepage = "https://github.com/tobi/motorsport-telemetry-rs"

[workspace.dependencies]
motorsport-telemetry = { version = "1.3.5", path = "crates/motorsport-telemetry" }
motorsport-telemetry-core = { version = "1.3.5", path = "crates/telemetry-core" }
motorsport-track-atlas = { version = "1.3.5", path = "crates/motorsport-track-atlas" }
aim-telemetry = { version = "1.3.5", path = "crates/aim-telemetry" }
cosworth-telemetry = { version = "1.3.5", path = "crates/cosworth-telemetry" }
motec-telemetry = { version = "1.3.5", path = "crates/motec-telemetry" }
racelogic-telemetry = { version = "1.3.5", path = "crates/racelogic-telemetry" }
telemetry-format = { version = "1.3.5", path = "crates/telemetry-format" }
telemetry-passes = { version = "1.3.5", path = "crates/telemetry-passes" }
memmap2 = "0.9"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
jiff = "0.2"
blake3 = "=1.5.5"
thiserror = "2"
tempfile = "=3.15.0"
zstd = "0.13"

# CI runs clippy with `-D warnings`, so every `warn` below is a hard error
# there. Test code is relaxed by clippy.toml (`allow-*-in-tests`) and by
# `cfg_attr(test, ...)` at each crate root.
[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise for this codebase.
cast_precision_loss = "allow"      # u64 ns / counts -> f64 is the data model
missing_errors_doc = "allow"       # every reader returns the crate Error
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"            # lat/lon, x0/x1, ...
many_single_char_names = "allow"   # geometry and filter maths
too_many_lines = "allow"           # binary format decoders are long by nature
# TODO: ~220 sites, mostly usize<->u32/u64 offsets and f64->int ns. Each
# needs a try_from or a reasoned allow; tracked separately from this pass.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Selected nursery lints.
use_self = "warn"
redundant_clone = "warn"
or_fun_call = "warn"
needless_collect = "warn"
derive_partial_eq_without_eq = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
equatable_if_let = "warn"
# Selected restriction lints.
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
get_unwrap = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_self_imports = "warn"
unwrap_used = "warn"
verbose_file_reads = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
