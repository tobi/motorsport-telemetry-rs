[workspace]
resolver = "2"
members = [
    "crates/motorsport-telemetry",
    "crates/motorsport-track-atlas",
    "crates/telemetry-core",
    "crates/aim-telemetry",
    "crates/cosworth-telemetry",
    "crates/motec-telemetry",
    "crates/racelogic-telemetry",
    "crates/telemetry-format",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
repository = "https://github.com/tobi/motorsport-telemetry-rs"
homepage = "https://github.com/tobi/motorsport-telemetry-rs"

[workspace.dependencies]
motorsport-telemetry = { version = "0.1.0", path = "crates/motorsport-telemetry" }
motorsport-telemetry-core = { version = "0.1.0", path = "crates/telemetry-core" }
motorsport-track-atlas = { version = "0.1.0", path = "crates/motorsport-track-atlas" }
aim-telemetry = { version = "0.1.0", path = "crates/aim-telemetry" }
cosworth-telemetry = { version = "0.1.0", path = "crates/cosworth-telemetry" }
motec-telemetry = { version = "0.1.0", path = "crates/motec-telemetry" }
racelogic-telemetry = { version = "0.1.0", path = "crates/racelogic-telemetry" }
telemetry-format = { version = "0.1.0", path = "crates/telemetry-format" }
memmap2 = "0.9"
flatbuffers = "25.2.10"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
blake3 = "=1.5.5"
thiserror = "2"
tempfile = "=3.15.0"

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
